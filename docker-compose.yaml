# =========================
# MyRAG 完整 Docker Compose
# =========================
# 大白话：
# Dockerfile 负责“构建 rag-app 镜像”。
# docker-compose.yaml 负责“一次性启动 MySQL + Milvus + rag-app”。
#
# 当前策略：
# - 代码在 rag-app 镜像里。
# - 原始文档放 ./data，通过挂载进入容器的 /app/data。
# - MySQL/Milvus/模型缓存放 ./volumes，容器删了数据也还在。
# - 不在这里自动建表；MySQL 表结构仍按你当前方式手动维护。

version: "3.8"

# Milvus 镜像复用写法：后面 standalone 和初始化容器都用这个镜像。
x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  # =========================
  # MySQL：存文档元数据、chunk 原文、聊天记忆
  # =========================
  mysql:
    image: mysql:8.0
    container_name: myrag-mysql
    restart: unless-stopped
    environment:
      # MYSQL_ROOT_PASSWORD 是 root 密码。
      # 如果宿主机没有设置 MYSQL_ROOT_PASSWORD，就默认用 123456。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}

      # 首次初始化 MySQL 数据目录时，会自动创建 rag_demo 数据库。
      # 注意：这里只建库，不建表；你说暂时不想放建表脚本。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_demo}
    ports:
      # 宿主机 3306 -> 容器 3306。
      # 如果你本机已有 MySQL 占用 3306，可以改成 "3307:3306"。
      - "3306:3306"
    volumes:
      # MySQL 真实数据保存到本机 ./volumes/mysql。
      # 容器删除后，只要这个目录还在，数据库数据就还在。
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      # 用 mysqladmin ping 检查 MySQL 是否真的能响应。
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =========================
  # Milvus volume 权限初始化
  # =========================
  # 这个容器只跑一次，用来修正 ./volumes/milvus 的目录权限。
  # 它不是业务服务，跑完就退出。
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - ./volumes/milvus:/var/lib/milvus

  # =========================
  # etcd：Milvus 的元数据协调服务
  # =========================
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      # etcd 数据保存到本机 ./volumes/etcd。
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =========================
  # MinIO：Milvus 用来保存对象数据
  # =========================
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      # 9001 是 MinIO 控制台，9000 是 MinIO API。
      - "9001:9001"
      - "9000:9000"
    volumes:
      # MinIO 数据保存到本机 ./volumes/minio。
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =========================
  # Milvus standalone：真正的向量数据库服务
  # =========================
  standalone:
    image: *milvus-image
    container_name: milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      # Milvus 数据保存到本机 ./volumes/milvus。
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      # 19530 是 Python pymilvus 连接端口；9091 是健康检查/管理端口。
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started

  # =========================
  # rag-app：你的 Python RAG 项目
  # =========================
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: myrag-app:0.1
    container_name: rag-app
    restart: unless-stopped
    environment:
      # Python 容器访问 MySQL 时，不能用 127.0.0.1。
      # 在 compose 网络里，要用服务名 mysql。
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_demo}

      # Python 容器访问 Milvus 时，也不能用 127.0.0.1。
      # 这里用 Milvus 服务名 standalone。
      MILVUS_URI: http://standalone:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-rag_chunks}

      # Embedding 配置。
      VECTOR_DIM: ${VECTOR_DIM:-1024}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}

      # Qwen / 阿里云百炼配置。
      # 推荐在宿主机或 .env 文件中配置 DASHSCOPE_API_KEY，不要写进镜像。
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://maas.qianwenaiapi.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-flash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # 原始文档挂载：宿主机 ./data -> 容器 /app/data。
      # 这样文档不会被打进镜像，换文档也不用重建镜像。
      - ./data:/app/data:ro

      # Docker 专用文档配置：把 documents.docker.yaml 挂载成容器内默认读取的 documents.yaml。
      - ./configs/documents.docker.yaml:/app/configs/documents.docker.yaml:ro

      # 模型缓存：embedding 模型第一次下载后会保存在这里，容器重建也不用重下。
      - ./volumes/model_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
      standalone:
        condition: service_healthy
    tty: true
    stdin_open: true

networks:
  default:
    name: myrag-network
